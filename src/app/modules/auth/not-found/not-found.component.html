<div class="error-container">

  <div class="error-card text-center">

    <!-- 404 Visual Icon / Graphic -->
    <div class="error-icon-wrapper" aria-hidden="true">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <!-- Error Code & Message -->
    <h1 class="error-code">404</h1>

    <h2 class="error-title">
      Page Not Found
    </h2>

    <p class="error-description">
      Oops! The page you are looking for might have been removed,
      had its name changed, or is temporarily unavailable.
    </p>

    <!-- Navigation Action -->
    <div class="error-action-group">
      <a routerLink="/dashboard" class="btn-action-primary" aria-label="Back to Dashboard">
        <i class="fa-solid fa-arrow-left me-2" aria-hidden="true"></i>
        <span>Back to Dashboard</span>
      </a>
    </div>

  </div>

</div>
