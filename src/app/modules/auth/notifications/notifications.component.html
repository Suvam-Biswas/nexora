<div class="notification-dropdown-container">

  <!-- =========================================================
       NOTIFICATION HEADER
       ========================================================= -->
  <div class="notification-header">

    <div class="header-title-group">

      <h4>Notifications</h4>

      <span class="unread-badge-count" *ngIf="unreadCount > 0">
        {{ unreadCount }} new
      </span>

    </div>

    <button type="button" class="mark-read-btn" *ngIf="unreadCount > 0" (click)="markAllAsRead()">

      <i class="fa-solid fa-check-double"></i>

      <span>Mark all read</span>

    </button>

  </div>


  <!-- =========================================================
       NOTIFICATION LIST
       ========================================================= -->
  <div class="notification-list">

    <div *ngFor="let item of notifications" class="notification-item" [class.unread]="!item.read">

      <!-- Notification Icon -->
      <div class="notification-icon-wrapper" [ngClass]="item.type">

        <i class="fa-solid" [ngClass]="item.icon">
        </i>

      </div>


      <!-- Notification Content -->
      <div class="notification-content">

        <div class="notification-title-row">

          <strong [title]="item.title">
            {{ item.title }}
          </strong>

          <span class="notification-time">
            {{ item.time }}
          </span>

        </div>

        <p>
          {{ item.description }}
        </p>

      </div>


      <!-- Mark As Read -->
      <button *ngIf="!item.read" type="button" class="single-read-btn" (click)="markAsRead(item, $event)"
        title="Mark as read" aria-label="Mark notification as read">

        <span class="dot-indicator"></span>

      </button>

    </div>


    <!-- =======================================================
         EMPTY STATE
         ======================================================= -->
    <div *ngIf="notifications.length === 0" class="notification-empty">

      <div class="empty-icon">
        <i class="fa-regular fa-bell-slash"></i>
      </div>

      <p>No notifications right now</p>

      <span>You're all caught up.</span>

    </div>

  </div>


  <!-- =========================================================
       NOTIFICATION FOOTER
       ========================================================= -->
  <div class="notification-footer">

    <a routerLink="/auth/audit-logs" (click)="onClose()" class="view-all-link">

      <span>View all activity logs</span>

      <i class="fa-solid fa-arrow-right"></i>

    </a>

  </div>

</div>
